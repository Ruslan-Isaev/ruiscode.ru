<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="priv-title">Политика конфиденциальности | RUIS</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
    <div class="container" style="max-width: 850px;">
        <div class="card legal-text">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1 data-i18n="priv-h1" style="font-size: 1.8rem;">Политика конфиденциальности</h1>
                <button id="lang-toggle" class="btn-text">EN</button>
            </div>
            <p><em data-i18n="priv-date">Последнее обновление: 13 июля 2026 г.</em></p>
            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
            
            <div id="privacy-content">
                <!-- Сюда скрипт вставит разметку на нужном языке -->
            </div>

            <div class="text-center" style="margin-top: 30px;">
                <a href="index.html" class="btn btn-primary" data-i18n="priv-back">Вернуться на главную</a>
            </div>
        </div>
    </div>

    <script>
        // Компактный скрипт только для страницы политики, синхронизированный с LocalStorage главного сайта
        const privTranslations = {
            ru: `
                <h2>1. ОБЩИЕ ПОЛОЖЕНИЯ</h2>
                <p>Настоящая Политика конфиденциальности (далее — Политика) разработана в соответствии с требованиями законодательства о персональных данных, включая Федеральный закон РФ от 27.07.2006 № 152-ФЗ «О персональных данных», Общий регламент по защите данных ЕС (GDPR), законы США (CCPA/CalOPPA), КНР (PIPL) и Австралии (Privacy Act 1988).</p>
                <p><strong>Оператор обработки данных:</strong> Физическое лицо, гражданин Российской Федерации, администратор домена ruiscode.ru (далее — Оператор). Связь с оператором: inbox@ruiscode.ru.</p>
                <p>Политика регулирует порядок обработки информации о пользователях (далее — Пользователь), посещающих веб-сайт https://ruiscode.ru.</p>

                <h2>2. КАТЕГОРИИ ДАННЫХ И ЦЕЛИ ОБРАБОТКИ</h2>
                <p>Сайт является статическим, выполняет функцию визитки и <strong>не осуществляет</strong> сбор, систематизацию или хранение конфиденциальных персональных данных (таких как ФИО, паспорта, биометрия, платежные реквизиты).</p>
                <h3>2.1. Локальное хранилище (LocalStorage)</h3>
                <p>Для обеспечения корректного и удобного человеко-машинного интерфейса, сайт использует технологию LocalStorage вашего браузера. В нем сохраняются:</p>
                <ul>
                    <li>Выбранная языковая локализация сайта (ключ 'lang').</li>
                    <li>Выбранная цветовая схема оформления (ключ 'theme').</li>
                </ul>
                <p>Данные параметры обрабатываются исключительно на стороне устройства Пользователя, не передаются Оператору и третьим лицам.</p>
                <h3>2.2. Технические данные (Логи)</h3>
                <p>При посещении сайта хостинг-провайдер и внешние используемые API могут автоматически фиксировать стандартные технические данные, передаваемые браузером (IP-адрес, тип браузера, операционная система, реферер). Оператор не использует их для идентификации физических лиц.</p>

                <h2>3. ПРАВОВЫЕ ОСНОВАНИЯ И МЕЖДУНАРОДНЫЕ ТРЕБОВАНИЯ</h2>
                <ul>
                    <li><strong>РФ (152-ФЗ):</strong> Обработка минимизирована. Использование LocalStorage осуществляется с согласия Пользователя (которое выражается продолжением использования интерфейса).</li>
                    <li><strong>Евросоюз (GDPR):</strong> Правовым основанием (Art. 6 (1) (f) GDPR) является легитимный интерес Оператора в предоставлении работоспособного и адаптивного веб-интерфейса.</li>
                    <li><strong>США, КНР, Австралия:</strong> Сайт не продает данные (Do Not Sell My Info), не отслеживает поведение Пользователей в коммерческих целях и соблюдает принципы минимизации данных (Data Minimization).</li>
                </ul>

                <h2>4. ИСПОЛЬЗОВАНИЕ ВНЕШНИХ СЕРВИСОВ (ТРАНСГРАНИЧНАЯ ПЕРЕДАЧА)</h2>
                <p>Для обеспечения работы виджетов сайт осуществляет прямые запросы из браузера Пользователя к инфраструктуре следующих третьих лиц:</p>
                <ul>
                    <li><strong>Open-Meteo API</strong> (Германия) — для получения метеоданных.</li>
                    <li><strong>QRServer API / Unknown055</strong> — для генерации QR-кодов кошельков.</li>
                    <li><strong>Google Fonts / FontAwesome CDN</strong> — для отображения шрифтов и графических иконок.</li>
                </ul>
                <p>Указанные сервисы обрабатывают технический IP-адрес Пользователя в соответствии со своими политиками приватности.</p>

                <h2>5. ПРАВА ПОЛЬЗОВАТЕЛЕЙ</h2>
                <p>Вы имеете право в любой момент очистить LocalStorage в настройках своего браузера, что приведет к полному стиранию сохраненных конфигураций тем и языка. Поскольку Оператор не хранит ваши персональные данные на сервере, запросы на удаление/изменение данных из БД неприменимы ввиду отсутствия таких баз.</p>
            `,
            en: `
                <h2>1. GENERAL PROVISIONS</h2>
                <p>This Privacy Policy (hereinafter — the Policy) is compliant with global data protection legal acts, including Federal Law of the Russian Federation No. 152-FZ "On Personal Data", EU General Data Protection Regulation (GDPR), US laws (CCPA/CalOPPA), China's PIPL, and Australia's Privacy Act 1988.</p>
                <p><strong>Data Controller:</strong> An individual, citizen of the Russian Federation, administrator of the domain ruiscode.ru (hereinafter — the Operator). Contact: inbox@ruiscode.ru.</p>
                <p>This Policy governs the processing of technical and preference information of users (hereinafter — the User) visiting https://ruiscode.ru.</p>

                <h2>2. DATA CATEGORIES AND PURPOSES OF PROCESSING</h2>
                <p>The website is static, serves as a digital business card, and <strong>does not</strong> collect, store, or process sensitive personal data (e.g., names, IDs, biometrics, or bank accounts).</p>
                <h3>2.1. LocalStorage</h3>
                <p>To provide a consistent and customized user interface, the site utilizes browser LocalStorage to store:</p>
                <ul>
                    <li>Language preferences (key: 'lang').</li>
                    <li>Visual theme mode (key: 'theme').</li>
                </ul>
                <p>These variables are kept and evaluated purely on the User's client side, and are never transmitted to the Operator or third parties.</p>
                <h3>2.2. Technical Metadata (Logs)</h3>
                <p>When accessing the web page, the hosting provider and external API endpoints may automatically capture standard HTTP metadata (IP address, user-agent, operating system). The Operator does not aggregate this technical data to identify any individual.</p>

                <h2>3. LEGAL BASES & GLOBAL STANDARDS</h2>
                <ul>
                    <li><strong>Russian Federation (152-ФЗ):</strong> Processing is heavily minimized. Storage of preferences is executed via implied consent during continuous site navigation.</li>
                    <li><strong>European Union (GDPR):</strong> The lawful basis under Art. 6 (1) (f) GDPR is the Operator's legitimate interest in rendering an optimized, adaptive, and working web interface.</li>
                    <li><strong>US, China, Australia:</strong> The website does not engage in selling data ("Do Not Sell My Personal Information"), does not track behavioral cross-site metrics, and completely complies with data minimization concepts.</li>
                </ul>

                <h2>4. THIRD-PARTY API SERVICES & CROSS-BORDER TRANSFER</h2>
                <p>To render live elements, the web application requests public data directly from the User's browser to the infrastructure of the following vendors:</p>
                <ul>
                    <li><strong>Open-Meteo API</strong> (Germany) — for pulling Moscow weather datasets.</li>
                    <li><strong>QRServer API</strong> — for rendering payment QR graphics.</li>
                    <li><strong>Google Fonts / FontAwesome CDN</strong> — for loading typographics and asset icons.</li>
                </ul>
                <p>These third parties process the User's network address (IP) under their own distinct privacy terms.</p>

                <h2>5. USER RIGHTS</h2>
                <p>Users hold the absolute right to purge LocalStorage records at any moment using native web-browser capabilities. Because the Operator maintains no server-side databases with consumer profiles, formal requests regarding automated data erasure from storage arrays are not applicable.</p>
            `
        };

        const uiTranslations = {
            ru: { "priv-title": "Политика конфиденциальности | RUIS", "priv-h1": "Политика конфиденциальности", "priv-date": "Последнее обновление: 13 июля 2026 г.", "priv-back": "Вернуться на главную" },
            en: { "priv-title": "Privacy Policy | RUIS", "priv-h1": "Privacy Policy", "priv-date": "Last updated: July 13, 2026", "priv-back": "Back to Home" }
        };

        let currentLang = localStorage.getItem('lang') || 'ru';

        function updateDOM() {
            document.documentElement.lang = currentLang;
            document.getElementById('privacy-content').innerHTML = privTranslations[currentLang];
            document.getElementById('lang-toggle').textContent = currentLang.toUpperCase();
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (uiTranslations[currentLang][key]) el.textContent = uiTranslations[currentLang][key];
            });
        }

        // Синхронизация темы
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.body.className = 'dark-theme';
        }

        document.getElementById('lang-toggle').addEventListener('click', () => {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            localStorage.setItem('lang', currentLang);
            updateDOM();
        });

        updateDOM();
    </script>
</body>
</html>
